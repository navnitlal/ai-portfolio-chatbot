[project]
name = "ai-portfolio-chatbot"
version = "0.3.0"
description = "Daily asset-class portfolio assistant (Streamlit + LangGraph) with SQLite, risk profiling, performance analytics, and Tavily trend insights."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "streamlit>=1.33",
  "pandas>=2.2",
  "numpy>=1.26",
  "python-dateutil>=2.9",
  "langchain>=0.2.12",
  "langchain-openai>=0.1.20",
  "langchain-tavily>=0.1.4",
  "langgraph>=0.2.30",
  "pydantic>=2.7",
  "python-dotenv>=1.0",
  "black>=26.1.0",
  "isort>=7.0.0",
  "openai>=1.0",
  "sounddevice>=0.4",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pytest-asyncio>=0.23",
  "pytest-cov>=4.1",
  "pytest-mock>=3.12",
  "respx>=0.21",
  "httpx>=0.27",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
asyncio_mode = "auto"
addopts = "-v --tb=short"
markers = [
  "unit: Unit tests (no external dependencies)",
  "integration: Integration tests (may use external services)",
  "llm: Tests that interact with LLM (mocked or real)",
  "slow: Slow-running tests",
]

[tool.coverage.run]
source = ["core", "agent"]
omit = ["tests/*", "*/__pycache__/*"]

[tool.coverage.report]
exclude_lines = [
  "pragma: no cover",
  "if __name__ == .__main__.:",
  "raise NotImplementedError",
]

[tool.uv]
